<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing — Scale" subtitle="8px grid, 4 → 144" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px 28px; background: var(--ink-page); display:flex; flex-direction:column; gap:8px; }
  .row { display:grid; grid-template-columns: 56px 56px 1fr; gap:14px; align-items:center; }
  .key { font-family: var(--font-mono); font-size:10px; color: var(--bone-300); }
  .val { font-family: var(--font-mono); font-size:10px; color: var(--bone-400); }
  .bar { height:10px; background: var(--moss-600); border-right: 1px solid var(--moss-bright); }
</style>
</head>
<body>
  <div class="row"><div class="key">--s-1</div><div class="val">4 px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="key">--s-2</div><div class="val">8 px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="key">--s-3</div><div class="val">12 px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="key">--s-4</div><div class="val">16 px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="key">--s-5</div><div class="val">24 px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="key">--s-6</div><div class="val">32 px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="key">--s-7</div><div class="val">48 px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="key">--s-8</div><div class="val">64 px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="key">--s-9</div><div class="val">96 px</div><div class="bar" style="width:96px"></div></div>
  <div class="row"><div class="key">--s-10</div><div class="val">144 px</div><div class="bar" style="width:144px"></div></div>
</body>
</html>
