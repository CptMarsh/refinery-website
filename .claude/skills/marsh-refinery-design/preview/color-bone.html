<!doctype html>
<!-- @dsCard group="Colors" name="Color — Bone" subtitle="Cream foreground (5 steps)" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Color — Bone</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px 28px; background: var(--ink-page); }
  .grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; }
  .swatch { aspect-ratio: 1 / 1; border:1px solid var(--ink-edge); display:flex; flex-direction:column; justify-content:flex-end; padding:8px; }
  .name { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:#0d0b08; }
  .hex { font-family: var(--font-mono); font-size:10px; color:#0d0b08; opacity:.7; margin-top:2px; }
  .header { font-size:11px; letter-spacing:.30em; text-transform:uppercase; color: var(--moss-500); margin-bottom:12px; }
</style>
</head>
<body>
  <div class="header">Bone — warm cream foreground</div>
  <div class="grid">
    <div class="swatch" style="background:#f0e7d2"><div class="name">Bone 100</div><div class="hex">#f0e7d2</div></div>
    <div class="swatch" style="background:#d4c9b0"><div class="name">Bone 200</div><div class="hex">#d4c9b0</div></div>
    <div class="swatch" style="background:#c8b89a"><div class="name">Bone 300</div><div class="hex">#c8b89a</div></div>
    <div class="swatch" style="background:#8a7d6a"><div class="name" style="color:#0d0b08">Bone 400</div><div class="hex" style="color:#0d0b08">#8a7d6a</div></div>
    <div class="swatch" style="background:#4a3f33"><div class="name" style="color:#d4c9b0">Bone 500</div><div class="hex" style="color:#d4c9b0">#4a3f33</div></div>
  </div>
</body>
</html>
