<!doctype html>
<!-- @dsCard group="Type" name="Type — Labels" subtitle="Eyebrow, meta, tag, nav, link" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Type — Labels</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px 28px; background: var(--ink-page); display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; align-items:center; gap:14px; }
  .key { width:100px; font-size:10px; letter-spacing:.30em; text-transform:uppercase; color: var(--ink-edge-3); }
  .eyebrow { font-size:12px; font-weight:500; letter-spacing:.40em; text-transform:uppercase; color: var(--moss-500); }
  .meta    { font-size:12px; font-weight:500; letter-spacing:.30em; text-transform:uppercase; color: var(--moss-500); }
  .tag     { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color: var(--moss-500); border:1px solid var(--moss-700); padding:5px 12px; }
  .nav     { font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color: var(--bone-200); }
  .link    { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color: var(--bone-300); text-decoration: underline; text-decoration-color: var(--moss-rule-40); text-underline-offset:4px; }
</style>
</head>
<body>
  <div class="row"><div class="key">Eyebrow</div><div class="eyebrow">Punch In</div></div>
  <div class="row"><div class="key">Meta</div><div class="meta">Status</div></div>
  <div class="row"><div class="key">Tag</div><div class="tag">Co-op</div><div class="tag">Horror</div></div>
  <div class="row"><div class="key">Nav</div><div class="nav">The Marsh Refinery</div></div>
  <div class="row"><div class="key">Link</div><div class="link">Playable build on itch.io</div></div>
</body>
</html>
