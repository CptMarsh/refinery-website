<!doctype html>
<!-- @dsCard group="Components" name="Components — Form" subtitle="Email input default + focus" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Form</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:28px; background: var(--ink-page); display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; }
  .input { flex:1; padding:12px 18px; background: var(--ink-surface); border:1px solid var(--ink-edge);
    color: var(--bone-300); font-family: var(--font-ui); font-size:14px; letter-spacing:.04em; outline:none;
    transition: border-color 300ms; }
  .input::placeholder { color: var(--ink-edge-3); }
  .input:focus { border-color: var(--moss-600); }
  .input.focus { border-color: var(--moss-600); }
  .btn { padding:12px 28px; border:1px solid var(--moss-600); color: var(--moss-500); background:transparent;
    font-family: var(--font-ui); font-weight:600; font-size:13px; letter-spacing:.18em; text-transform:uppercase;
    cursor:pointer; }
  .label { font-size:10px; letter-spacing:.30em; text-transform:uppercase; color: var(--ink-edge-3); margin-bottom:6px; }
</style>
</head>
<body>
  <div>
    <div class="label">Default</div>
    <div class="row">
      <input class="input" placeholder="your@email.com" />
      <button class="btn">Notify Me</button>
    </div>
  </div>
  <div>
    <div class="label">Focus</div>
    <div class="row">
      <input class="input focus" value="omer@themarshrefinery.com" />
      <button class="btn">Notify Me</button>
    </div>
  </div>
</body>
</html>
