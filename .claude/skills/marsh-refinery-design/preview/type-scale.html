<!doctype html>
<!-- @dsCard group="Type" name="Type — Scale" subtitle="H1 / H2 / H3 / body / small with specs" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Type — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px 28px; background: var(--ink-page); }
  .row { display:grid; grid-template-columns: 60px 90px 1fr; gap:18px; align-items:baseline; padding: 6px 0; border-bottom: 1px solid var(--ink-rule); }
  .row:last-child { border-bottom: 0; }
  .label { font-size:10px; letter-spacing:.30em; text-transform:uppercase; color: var(--moss-500); }
  .meta  { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color: var(--bone-400); }
  .h1 { font-family: var(--font-ui); font-weight:900; font-size:30px; letter-spacing:.08em; text-transform:uppercase; color: var(--bone-200); }
  .h2 { font-family: var(--font-ui); font-weight:900; font-size:22px; letter-spacing:.18em; text-transform:uppercase; color: var(--bone-200); }
  .h3 { font-family: var(--font-ui); font-weight:600; font-size:18px; color: var(--bone-300); }
  .body { font-family: var(--font-body); font-style: italic; font-size:19px; line-height:1.45; color: var(--bone-400); }
  .small { font-size:13px; color: var(--bone-400); }
</style>
</head>
<body>
  <div class="row"><div class="label">H1</div><div class="meta">900 · 30 · .08</div><div class="h1">Follow the Dig</div></div>
  <div class="row"><div class="label">H2</div><div class="meta">900 · 22 · .18</div><div class="h2">Punch In</div></div>
  <div class="row"><div class="label">H3</div><div class="meta">600 · 18</div><div class="h3">Seeking funding</div></div>
  <div class="row"><div class="label">Body</div><div class="meta">italic · 15</div><div class="body">Get dispatches from the Refinery — dev logs, reveals, release dates.</div></div>
  <div class="row"><div class="label">Small</div><div class="meta">13</div><div class="small">© 2026 The Marsh Refinery. All rights reserved.</div></div>
</body>
</html>
